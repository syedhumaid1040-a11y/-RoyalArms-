unlock:
  # Crafted weapons start locked. Unique player kills unlock them in stages:
  # 1 kill = passive, 2 kills = ability 1, 3 kills = ability 2
  enabled: true

power:
  hits-per-bar: 5       # melee hits needed to fill one power bar (3 bars max)
                        # a mace smash (falling hit) fills a whole bar

weapons:
  shockwave:
    cooldown1: 12
    cooldown2: 25
    stun-seconds: 1
    chain-damage: 5
  lifestealer:
    cooldown1: 20
    cooldown2: 35
    heal-percent: 0.3   # of melee damage, for 10s
    venom-chance: 0.15
  warden_battleaxe:
    cooldown1: 15
    cooldown2: 25
    sonic-damage: 7     # ignores armor
    spread-sculk: true  # kills with Ground Pound turn nearby ground into sculk
  primal_spear:
    cooldown1: 10
    cooldown2: 25
    throw-damage: 7
    vines-seconds: 3
    speed-amplifier: 1  # 0 = Speed I, 1 = Speed II (while the spear is carried)
  afterburner:
    cooldown1: 8
    cooldown2: 20
    orb-damage: 5
    shuriken-damage: 6
  void_hammer:
    cooldown1: 12
    cooldown2: 30
    toss-range: 20
    peekaboo-range: 40
    peekaboo-height: 8
    levitation-chance: 0.15

artifacts:
  cloak_of_shadows:
    cooldown: 90
    seconds: 15
  jumbo_rocket:
    cooldown: 60
  gale_rod:
    cooldown: 20
  chrono_clock:
    cooldown: 120
  tracker_compass:
    cooldown: 30
    range: 150
  bucket_of_malk:
    cooldown: 60
  bucket_of_greed:
    cooldown: 60
    radius: 12

recipes:
  enabled: true

altar:
  offering-material: NETHERITE_INGOT
  offering-amount: 4
  cooldown-seconds: 600

structures:
  enabled: true
  chance: 0.004
  # Chance that a shrine's loot chest holds a random artifact
  artifact-chance: 0.35
  worlds: []
